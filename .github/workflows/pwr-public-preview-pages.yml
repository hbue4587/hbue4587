name: Public PWR Music preview (no production changes)

on:
  push:
    branches: [main]
    paths:
      - 'pwr-music/**'
      - '.github/workflows/pwr-public-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pwr-music-public-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy already-public HTML previews to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify metadata-only preview inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s pwr-music/index.html
          test -s pwr-music/label.html
          test -s pwr-music/henry-miguel.html
          test -s pwr-music/preview.html
          test -s pwr-music/radio.html
          test -s pwr-music/press.html
          test -s pwr-music/singles.html
          test -s pwr-music/credits.html
          test -s pwr-music/discography.html
          test -s pwr-music/songs.html
          test -s pwr-music/find.html
          grep -q 'data-preview-page="radio.html"' pwr-music/find.html
          grep -q 'OPEN-PWR-RADIO.html' pwr-music/find.html
          grep -Fq "location.hostname==='htmlpreview.github.io'?'':location.search.slice(1)" pwr-music/find.html
          test -s pwr-music/genres.html
          test -s pwr-music/albums.html
          test -s pwr-music/verified-releases.csv
          test -s pwr-music/playlists.html
          test "$(grep -o 'class="playlist"' pwr-music/playlists.html | wc -l)" -eq 8
          test "$(grep -o 'class="track"' pwr-music/playlists.html | wc -l)" -eq 11
          grep -q 'noindex,nofollow,noarchive' pwr-music/playlists.html
          grep -Fq 'data-preview-page="playlists.html"' pwr-music/index.html
          test -s pwr-music/spotlight.html
          test "$(grep -c 'class="track" data-search=' pwr-music/spotlight.html)" -eq 13
          grep -q 'noindex,nofollow,noarchive' pwr-music/spotlight.html
          grep -q 'data-preview-page="spotlight.html"' pwr-music/index.html
          test -s pwr-music/verified-songs.csv
          test "$(wc -l < pwr-music/verified-releases.csv | tr -d ' ')" -eq 204
          test "$(wc -l < pwr-music/verified-songs.csv | tr -d ' ')" -eq 82
          grep -q 'verified-releases.csv' pwr-music/index.html
          grep -q 'verified-songs.csv' pwr-music/index.html
          if grep -Ein 'https://(drive.google.com|docs.google.com)|artist.amuse.io|[.]mp3|[.]wav|raw_master|Dad Handoff' pwr-music/verified-{releases,songs}.csv; then
            echo 'Unexpected private audio or administrative data in released-metadata export'
            exit 1
          fi
          test "$(grep -c 'class="song"' pwr-music/credits.html)" -eq 80
          test "$(grep -c 'class="single"' pwr-music/singles.html)" -eq 34
          test "$(grep -c 'class="release"' pwr-music/discography.html)" -eq 203
          test "$(grep -c 'class="song"' pwr-music/songs.html)" -eq 81
          test "$(grep -o 'class="primary" href="https://open.spotify.com/track/' pwr-music/songs.html | wc -l)" -eq 71
          grep -q 'frame-src https://open.spotify.com' pwr-music/songs.html
          grep -q 'function stopEmbed()' pwr-music/songs.html
          grep -q "frame.src='https://open.spotify.com/embed/track/'" pwr-music/songs.html
          grep -q 'noindex,nofollow,noarchive' pwr-music/press.html
          grep -q 'noindex,nofollow,noarchive' pwr-music/credits.html
          grep -q 'noindex,nofollow,noarchive' pwr-music/discography.html
          grep -q 'Print / Save PDF' pwr-music/discography.html
          grep -q 'Print / Save PDF' pwr-music/press.html
          grep -q 'noindex,nofollow,noarchive' pwr-music/radio.html
          grep -q '71</strong> exact Spotify recordings' pwr-music/radio.html
          grep -q 'noindex,nofollow,noarchive' pwr-music/singles.html
          grep -q 'noindex,nofollow,noarchive' pwr-music/index.html
          grep -q 'noindex,nofollow,noarchive' pwr-music/label.html
          grep -q 'noindex,nofollow,noarchive' pwr-music/henry-miguel.html
          if grep -Ein 'https://(drive.google.com|docs.google.com)|artist.amuse.io|\.mp3|\.wav' pwr-music/{index,label,henry-miguel,preview,singles,radio,press,credits,discography,songs,find,genres,albums,spotlight,playlists}.html; then
            echo 'Unexpected private audio/admin link or audio filename in public preview'
            exit 1
          fi
          echo 'Only public HTML metadata with noindex was staged'
      - name: Check or initialize no-cost Pages preview (never production hosting)
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          get_pages_status() {
            curl --silent --show-error --output /tmp/pwr-pages-state.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPOSITORY/pages"
          }
          status=$(get_pages_status)
          if [ "$status" = "404" ]; then
            # A public Pages preview doesn't change production DNS, WordPress or commerce.
            echo 'No Pages preview exists; requesting free GitHub Actions Pages site.'
            create_status=$(curl --silent --show-error --output /tmp/pwr-pages-create.json --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'Content-Type: application/json' \
              --data '{"build_type":"workflow"}' \
              "https://api.github.com/repos/$REPOSITORY/pages")
            if [ "$create_status" = "201" ] || [ "$create_status" = "200" ] || [ "$create_status" = "422" ]; then
              status=$(get_pages_status)
            elif [ "$create_status" = "403" ]; then
              echo 'GitHub Actions token lacks permission to initialize Pages (HTTP 403).'
            else
              echo "Pages initialization did not succeed (HTTP $create_status)."
            fi
          fi
          if [ "$status" = "200" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages preview confirmed; deploying verified noindex files.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" = "404" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages remains disabled. In repository Settings > Pages choose GitHub Actions. Downloadable HTML artifact is available below.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unexpected Pages API status: $status" >&2
            exit 1
          fi
      - name: Upload verified standalone site for review
        uses: actions/upload-artifact@v4
        with:
          name: pwr-music-public-noindex-site
          path: pwr-music/
          retention-days: 14
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload public preview artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pwr-music
      - name: Deploy public preview
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record published preview
        if: steps.pages.outputs.enabled == 'true' && success()
        run: |
          echo "PWR Music + Henry Miguel public preview: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This does not change pwrmusic.net, hmiguel.com or any WordPress/WooCommerce store." >> "$GITHUB_STEP_SUMMARY"
